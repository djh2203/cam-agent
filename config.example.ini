[server]
# HTTP 网关监听地址, 默认本机
host = 127.0.0.1
port = 8080

[ai]
# 仅 [tts] backend = openai 时使用(意图理解/视觉都走本地 llama-server, 不读这里)
base_url = https://api.openai.com/v1
api_key = sk-xxxx
tts_model = tts-1
tts_voice = alloy

[tts]
# edge: 使用 edge-tts(免费,推荐); openai: 使用 AI tts_model
backend = edge
edge_voice = zh-CN-XiaoxiaoNeural
language = zh-CN