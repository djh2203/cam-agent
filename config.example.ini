[camera]
# 大华摄像头地址(局域网)
ip = 192.168.1.10
port = 37777
username = admin
password = change_me
channel = 0

[server]
# HTTP 网关监听地址, 默认本机
host = 127.0.0.1
port = 8080

[ai]
# OpenAI 兼容接口(OpenAI / DeepSeek / Moonshot / 通义 等均可)
base_url = https://api.openai.com/v1
api_key = sk-xxxx
chat_model = gpt-4o-mini
vision_model = gpt-4o-mini
tts_model = tts-1
tts_voice = alloy

[tts]
# edge: 使用 edge-tts(免费,推荐); openai: 使用 AI tts_model
backend = edge
edge_voice = zh-CN-XiaoxiaoNeural
language = zh-CN