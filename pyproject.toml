[project]
name = "cam-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "edge-tts",
    "mcp>=2.0.0",
    "faster-whisper>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camgate"]

[project.scripts]
camgate = "camgate.__main__:main"

[dependency-groups]
dev = []

[tool.uv]
package = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true