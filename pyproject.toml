[project]
name = "camgate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "netsdk",
    "edge-tts",
    "mcp>=2.0.0",
    "faster-whisper>=1.0.0",
    "llama-cpp-python>=0.3.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camgate"]

[project.scripts]
camgate = "camgate.__main__:main"

[dependency-groups]
dev = []

[tool.uv]
package = true

[tool.uv.sources]
netsdk = { path = "vendor/NetSDK-2.0.0.1-py3-none-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
